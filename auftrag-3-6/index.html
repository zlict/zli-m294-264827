<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantonswappen-Memory</title>
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 100px);
        }

        #board img {
            filter: contrast(0);
            transition: 1s;
            height: 100%;
            width: 100%;
            object-fit: contain;

            &.selected {
                filter: none;
            }
        }

    </style>
    <script>
        const cards = ["ag", "be", "fr", "gr", "ne", "sg", "sz", "ur", "zg", "ai", "bl", "ge", "ju", "nw", "sh", "tg", "vd", "zh", "ar", "bs", "gl", "lu", "ow", "so", "ti", "vs"];
        const selectedCards = [];

        function selectCard() {
            this.classList.toggle("selected");
            selectedCards.push(this);
        }

        function createCard(symbol) {
            const card = document.createElement("img");
            card.src = `./img/${symbol}.png`;
            card.addEventListener("click", selectCard);
            return card;
        }

        function initializeBoard() {
            const board = document.getElementById("board");
            const selectedCards = cards.sort(() => 0.5 - Math.random()).slice(0, 10);
            const allCards = [...selectedCards, ...selectedCards];
            allCards.sort(() => 0.5 - Math.random());
            allCards.forEach(
                (card) => board.appendChild(createCard(card))
            );
        }

        document.addEventListener("DOMContentLoaded", () => {
            initializeBoard();
        });
    </script>
</head>
<body>
    <div id="board">
    </div>
</body>
</html>
